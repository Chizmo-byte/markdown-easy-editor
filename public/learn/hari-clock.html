<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>はり うごかしどけい | LifeMargin Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F3; --card:#FFFFFF; --ink:#31424B; --sub:#7C8B92;
  --green:#2F8F6B; --green-deep:#227455; --green-soft:#E3F1EA;
  --blue:#5B7FD4; --blue-deep:#3D5FAE; --blue-soft:#E9EFFB;
  --cherry:#E8734F; --cherry-deep:#C85A38; --cherry-soft:#FBEDE6;
  --r:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  font-size:17px; line-height:1.6; min-height:100vh;
}
.wrap{max-width:560px; margin:0 auto; padding:16px 14px 80px;}
header{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:4px 4px 10px;}
h1{font-size:20px; font-weight:800; margin:0;}
h1 .dot{color:var(--cherry);}
.count{font-size:13px; color:var(--sub); font-weight:700;}
.count b{color:var(--green); font-size:17px;}

.tabs{display:flex; background:#E2E9E6; border-radius:999px; padding:4px; margin-bottom:12px;}
.tabs button{
  flex:1; border:0; background:transparent; border-radius:999px; padding:10px;
  font-family:inherit; font-size:15px; font-weight:800; color:var(--sub); cursor:pointer;
}
.tabs button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(40,60,55,.18);}

.stage-chips{display:flex; gap:8px; justify-content:center; margin-bottom:10px;}
.schip{
  border:2px solid #DDE5E1; background:var(--card); color:var(--sub);
  border-radius:999px; padding:8px 14px; font-family:inherit; font-size:14px; font-weight:800; cursor:pointer;
}
.schip.on{border-color:var(--cherry); background:var(--cherry-soft); color:var(--cherry-deep);}

.seg{display:flex; background:#E2E9E6; border-radius:999px; padding:4px; margin-bottom:10px;}
.seg button{
  flex:1; border:0; background:transparent; border-radius:999px;
  padding:8px 6px; font-family:inherit; font-size:13px; font-weight:800; color:var(--sub); cursor:pointer;
}
.seg button.on{background:var(--card); color:var(--green-deep); box-shadow:0 1px 3px rgba(40,60,55,.18);}

.card{background:var(--card); border-radius:var(--r); padding:16px 14px; box-shadow:0 2px 10px rgba(40,60,55,.07); margin-bottom:14px;}
.mission{text-align:center; font-size:15px; font-weight:800; color:var(--sub); margin-bottom:4px; min-height:24px;}
.target{text-align:center; font-size:28px; font-weight:800; min-height:44px; margin-bottom:4px;}
.readout{
  display:flex; justify-content:center; align-items:baseline; gap:6px;
  font-size:36px; font-weight:800; min-height:54px; margin-bottom:4px;
}
.readout .h{color:var(--blue-deep);}
.readout .m{color:var(--green-deep);}
.readout .u{font-size:22px;}
.pill{display:inline-block; border-radius:12px; padding:0 12px;}
.pill.h{background:var(--blue-soft); color:var(--blue-deep);}
.pill.m{background:var(--green-soft); color:var(--green-deep);}

.clock-svg{display:block; width:100%; max-width:440px; margin:0 auto; touch-action:none; user-select:none; -webkit-user-select:none;}
.hint-line{text-align:center; color:var(--sub); font-size:13px; font-weight:700; margin-top:4px;}

.choices{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px;}
.choice{
  border:2px solid #DDE5E1; background:#FBFDFC; border-radius:16px;
  padding:14px 6px; font-family:inherit; font-size:20px; font-weight:800; color:var(--ink); cursor:pointer;
}
.choice:active{background:var(--green-soft);}
.choice.ok{border-color:var(--green); background:var(--green-soft); color:var(--green-deep);}
.choice.ng{border-color:#E5B8A6; background:var(--cherry-soft); animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.msg{min-height:28px; text-align:center; font-weight:800; font-size:16px; margin-top:10px; color:var(--sub);}
.msg.good{color:var(--green-deep);}
.msg.soft{color:#B07D4F;}

.check-btn{
  width:100%; border:0; border-radius:16px; background:var(--green); color:#fff;
  font-family:inherit; font-size:19px; font-weight:800; padding:15px; cursor:pointer; margin-top:12px;
  box-shadow:0 3px 0 var(--green-deep);
}
.sprint-btn{
  display:block; margin:0 auto 12px;
  border:2px solid var(--blue); color:var(--blue); background:var(--card);
  border-radius:999px; padding:9px 18px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer;
}
.next-btn{
  width:100%; border:0; border-radius:16px; background:var(--green); color:#fff;
  font-family:inherit; font-size:19px; font-weight:800; padding:15px; cursor:pointer; margin-top:8px;
  box-shadow:0 3px 0 var(--green-deep);
}
.ghost-btn{
  width:100%; border:2px solid #D5DEDA; border-radius:16px; background:var(--card); color:var(--sub);
  font-family:inherit; font-size:15px; font-weight:800; padding:12px; cursor:pointer; margin-top:10px;
}
.done-face{text-align:center; font-size:50px; margin:4px 0;}
.done-text{text-align:center; font-size:22px; font-weight:800; color:var(--green-deep); margin-bottom:12px;}

.overlay{
  position:fixed; inset:0; background:rgba(38,52,48,.45); display:none;
  align-items:flex-start; justify-content:center; padding:24px 14px; z-index:50; overflow:auto;
}
.overlay.show{display:flex;}
.sprint-card{background:var(--card); border-radius:var(--r); padding:20px 18px; width:100%; max-width:520px;}
.sprint-head{display:flex; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:10px;}
.sprint-time{font-size:26px; color:var(--blue);}
.sprint-q{font-size:26px; font-weight:800; text-align:center; margin:14px 0;}
.close-x{border:0; background:transparent; font-size:22px; cursor:pointer; color:var(--sub); font-weight:800;}

@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>はり うごかしどけい<span class="dot">🕒</span></h1>
    <div class="count">せいかい: <b id="streak">0</b> かい</div>
  </header>

  <div class="tabs">
    <button id="tabFree" class="on">👆 さわってみる</button>
    <button id="tabQuiz">🎯 クイズ</button>
  </div>

  <div class="stage-chips" id="stageChips" style="display:none">
    <button class="schip on" data-st="h">なんじ？</button>
    <button class="schip" data-st="m">なんぷん？</button>
    <button class="schip" data-st="hm">なんじなんぷん？</button>
  </div>

  <div class="seg" id="seg">
    <button data-lv="0" class="on">🐢 めもり ぜんぶ</button>
    <button data-lv="1">🚶 いろだけ</button>
    <button data-lv="2">🚀 ほんものどけい</button>
  </div>

  <button class="sprint-btn" id="sprintOpen" style="display:none">⚡ 5とびスプリント（60びょう）</button>

  <div class="card">
    <div class="mission" id="mission">はりを ゆびで まわしてみよう</div>
    <div class="target" id="target"></div>
    <div class="readout" id="readout"></div>
    <svg id="clock" class="clock-svg" viewBox="0 0 480 480"></svg>
    <div class="hint-line" id="hintLine">みじかい はり＝うちがわ、ながい はり＝そとがわを さわってね</div>
    <button class="check-btn" id="checkBtn" style="display:none">これで ピッタリ！</button>
    <div id="choiceArea"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sprint-card">
    <div class="sprint-head">
      <span>⚡ 5とびスプリント</span>
      <button class="close-x" id="sprintClose">✕</button>
    </div>
    <div id="sprintBody"></div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1));}

/* ---------- state ---------- */
let H=3, M=0;              // current clock time (H:0-11)
let mode="free";           // free | quiz
let lv=0;                  // 0 full support / 1 colors only / 2 plain
let stage="h";             // quiz stage: h | m | hm
let Q=null;                // {type:'set'|'read', th, tm}
let streak=0;
let lastDragM=0;

/* ---------- helpers ---------- */
const CX=240, CY=240;
function pt(angleDeg, r){
  const a=angleDeg*Math.PI/180;
  return [CX+r*Math.sin(a), CY-r*Math.cos(a)];
}
function dispH(h){ return h===0?12:h; }
function funSuffix(m){ return m%10===0?"ぷん":"ふん"; }
function timeText(h,m){
  return m===0 ? dispH(h)+"じ ちょうど" : dispH(h)+"じ "+m+funSuffix(m);
}

/* ---------- clock drawing ---------- */
function drawClock(showZone){
  let html="";
  // face
  html+='<circle cx="'+CX+'" cy="'+CY+'" r="228" fill="#FFFFFF" stroke="#C7D2CC" stroke-width="3"/>';

  // hour zone shading (🐢 only): current hour sector
  if(lv===0 && showZone!==false){
    const a1=H*30, a2=(H+1)*30;
    const [x1,y1]=pt(a1,170), [x2,y2]=pt(a2,170);
    html+='<path d="M '+CX+' '+CY+' L '+x1+' '+y1+' A 170 170 0 0 1 '+x2+' '+y2+' Z" fill="#FBEDE6" opacity="0.85"/>';
  }

  // 5-minute chunk ring (🐢🚶)
  if(lv<=1){
    for(let i=0;i<12;i++){
      const a1=i*30+1.5, a2=(i+1)*30-1.5;
      const [x1,y1]=pt(a1,206), [x2,y2]=pt(a2,206);
      html+='<path d="M '+x1+' '+y1+' A 206 206 0 0 1 '+x2+' '+y2+'" fill="none" stroke="'+(i%2? "#E3F1EA":"#CFE7DC")+'" stroke-width="13"/>';
    }
  }

  // ticks
  for(let i=0;i<60;i++){
    const big=i%5===0;
    const [x1,y1]=pt(i*6, big?196:200);
    const [x2,y2]=pt(i*6, 214);
    html+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(big?"#5A6E77":"#B8C6C0")+'" stroke-width="'+(big?4:2)+'"/>';
  }

  // hour numbers (blue)
  for(let i=1;i<=12;i++){
    const [x,y]=pt(i*30, 168);
    html+='<text x="'+x+'" y="'+(y+11)+'" font-size="34" font-weight="800" fill="#4A72C4" text-anchor="middle" font-family="inherit">'+i+'</text>';
  }
  // minute numbers (green, 🐢 only)
  if(lv===0){
    for(let i=0;i<12;i++){
      const [x,y]=pt(i*30, 232);
      html+='<text x="'+x+'" y="'+(y+7)+'" font-size="17" font-weight="800" fill="#2F8F6B" text-anchor="middle" font-family="inherit">'+(i*5===0?"0":i*5)+'</text>';
    }
  }

  // hands
  const hourAngle=(H+M/60)*30, minAngle=M*6;
  const [hx,hy]=pt(hourAngle,100);
  const [mx,my]=pt(minAngle,168);
  html+='<line x1="'+CX+'" y1="'+CY+'" x2="'+hx+'" y2="'+hy+'" stroke="#4A72C4" stroke-width="14" stroke-linecap="round"/>';
  html+='<line x1="'+CX+'" y1="'+CY+'" x2="'+mx+'" y2="'+my+'" stroke="#2F8F6B" stroke-width="9" stroke-linecap="round"/>';
  html+='<circle cx="'+CX+'" cy="'+CY+'" r="12" fill="#31424B"/>';

  $("#clock").innerHTML=html;
}

/* ---------- readout ---------- */
function drawReadout(){
  const ro=$("#readout");
  if(mode==="quiz" && Q && Q.type==="read"){ ro.innerHTML=""; return; }
  if(mode==="quiz" && Q && Q.type==="set"){
    // partial readout: show only what's NOT being asked (support without giving away)
    if(stage==="m"){
      ro.innerHTML='<span class="pill h">'+dispH(H)+'<span class="u">じ</span></span><span style="color:var(--sub);font-size:20px">は そのまま</span>';
    }else{
      ro.innerHTML="";
    }
    return;
  }
  ro.innerHTML='<span class="pill h">'+dispH(H)+'<span class="u">じ</span></span>'+
    (M===0?'<span style="font-size:22px;color:var(--sub)">ちょうど</span>'
          :'<span class="pill m">'+M+'<span class="u">'+funSuffix(M)+'</span></span>');
}

/* ---------- drag ---------- */
const svg=document.getElementById("clock");
let dragging=null; // 'h' | 'm'
function evtAngleR(e){
  const rect=svg.getBoundingClientRect();
  const scale=480/rect.width;
  const x=(e.clientX-rect.left)*scale, y=(e.clientY-rect.top)*scale;
  const dx=x-CX, dy=y-CY;
  let ang=Math.atan2(dx,-dy)*180/Math.PI; if(ang<0)ang+=360;
  return [ang, Math.hypot(dx,dy)];
}
svg.addEventListener("pointerdown",e=>{
  if(mode==="quiz" && Q && Q.type==="read") return; // locked while reading
  const [ang,r]=evtAngleR(e);
  if(r>240) return;
  dragging = r<115 ? "h" : "m";
  svg.setPointerCapture(e.pointerId);
  lastDragM=M;
  applyDrag(ang);
});
svg.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const [ang]=evtAngleR(e);
  applyDrag(ang);
});
svg.addEventListener("pointerup",()=>dragging=null);
svg.addEventListener("pointercancel",()=>dragging=null);
function applyDrag(ang){
  if(dragging==="h"){
    H=Math.round(ang/30)%12;
  }else{
    const snap=(mode==="quiz")?5:1;
    let nm=Math.round(ang/6/snap)*snap%60;
    if(lastDragM>=45 && nm<=15){ H=(H+1)%12; }
    if(lastDragM<=15 && nm>=45){ H=(H+11)%12; }
    M=nm; lastDragM=nm;
  }
  drawClock(); drawReadout();
}

/* ---------- quiz ---------- */
function randomTime(){
  if(stage==="h") return [rint(0,11), 0];
  if(stage==="m") return [H, rint(1,11)*5];
  return [rint(0,11), rint(1,11)*5];
}
function newQuiz(){
  $("#msg").textContent=""; $("#msg").className="msg";
  $("#choiceArea").innerHTML="";
  const [th,tm]=randomTime();
  const type=Math.random()<0.5?"set":"read";
  Q={type, th, tm};
  if(type==="set"){
    if(stage!=="m"){
      H=(th+rint(2,9))%12;
      if(stage==="h"){ M=0; }
      else{ let off=(tm+rint(15,40))%60; M=off-off%5; }
    }else{
      let off=(tm+rint(15,40))%60; M=off-off%5;
    }
    lastDragM=M;
    $("#mission").textContent="はりを うごかして あわせよう";
    $("#target").innerHTML=targetHtml(th,tm);
    $("#checkBtn").style.display="block";
  }else{
    H=th; M=tm; lastDragM=M;
    $("#mission").textContent="とけいを よもう";
    $("#target").innerHTML="";
    $("#checkBtn").style.display="none";
    buildReadChoices();
  }
  drawClock(); drawReadout();
}
function targetHtml(th,tm){
  if(stage==="h") return '<span class="pill h">'+dispH(th)+'<span style="font-size:20px">じ</span></span> ちょうどに あわせてね';
  if(stage==="m") return '<span class="pill m">'+tm+'<span style="font-size:20px">'+funSuffix(tm)+'</span></span> に あわせてね';
  return '<span class="pill h">'+dispH(th)+'<span style="font-size:20px">じ</span></span><span class="pill m">'+tm+'<span style="font-size:20px">'+funSuffix(tm)+'</span></span> に あわせてね';
}
function buildReadChoices(){
  let correct, opts=new Set();
  if(stage==="h"){
    correct=dispH(Q.th)+"じ";
    opts.add(correct);
    while(opts.size<3){ opts.add(dispH((Q.th+rint(1,11))%12)+"じ"); }
  }else if(stage==="m"){
    correct=Q.tm+funSuffix(Q.tm);
    opts.add(correct);
    opts.add((Q.tm/5)+funSuffix(Q.tm/5));            // ×5わすれ distractor
    while(opts.size<3){ const w=rint(1,11)*5; if(w!==Q.tm) opts.add(w+funSuffix(w)); }
  }else{
    correct=dispH(Q.th)+"じ"+Q.tm+funSuffix(Q.tm);
    opts.add(correct);
    opts.add(dispH((Q.th+1)%12)+"じ"+Q.tm+funSuffix(Q.tm));   // ゾーンまちがい distractor
    opts.add(dispH(Q.th)+"じ"+(Q.tm/5)+funSuffix(Q.tm/5));    // ×5わすれ distractor
  }
  const arr=shuffle([...opts]).slice(0,3);
  if(!arr.includes(correct)){ arr[0]=correct; shuffle(arr); }
  $("#choiceArea").innerHTML='<div class="choices">'+arr.map(o=>'<button class="choice" data-v="'+o+'">'+o+"</button>").join("")+"</div>";
  document.querySelectorAll("#choiceArea .choice").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(btn.dataset.v===correct){
        btn.classList.add("ok");
        good(timeText(Q.th,Q.tm)+"！");
        document.querySelectorAll("#choiceArea .choice").forEach(b=>b.disabled=true);
        setTimeout(newQuiz,1300);
      }else{
        btn.classList.add("ng"); btn.disabled=true;
        soft(stage==="m"||stage==="hm" ? "ながい はりの めもりは 5とびで かぞえるよ" : "みじかい はりを よく みてみて");
      }
    });
  });
}
$("#checkBtn").addEventListener("click",()=>{
  if(!Q||Q.type!=="set")return;
  const hOK=(stage==="m")||H===Q.th;
  const mOK=(stage==="h")?M===0:M===Q.tm;
  if(hOK&&mOK){
    good("🎉 ピッタリ！ "+timeText(Q.th,Q.tm)+" だね");
    setTimeout(newQuiz,1500);
  }else if(!mOK){
    soft("ながい はりが まだ ちがうよ。"+(stage!=="h"?Q.tm+funSuffix(Q.tm)+" は…どこかな？":"12の ところに もどそう"));
  }else{
    soft("みじかい はりを "+dispH(Q.th)+"の ところへ うごかそう");
  }
});
function good(t){ const m=$("#msg"); m.textContent=t; m.className="msg good"; streak++; $("#streak").textContent=streak; }
function soft(t){ const m=$("#msg"); m.textContent=t; m.className="msg soft"; }

/* ---------- tabs / stage / level ---------- */
$("#tabFree").addEventListener("click",()=>setMode("free"));
$("#tabQuiz").addEventListener("click",()=>setMode("quiz"));
function setMode(m){
  mode=m; Q=null;
  $("#tabFree").classList.toggle("on",m==="free");
  $("#tabQuiz").classList.toggle("on",m==="quiz");
  $("#stageChips").style.display=m==="quiz"?"flex":"none";
  $("#sprintOpen").style.display=m==="quiz"?"block":"none";
  $("#checkBtn").style.display="none";
  $("#choiceArea").innerHTML="";
  $("#msg").textContent=""; $("#msg").className="msg";
  $("#target").innerHTML="";
  if(m==="free"){
    $("#mission").textContent="はりを ゆびで まわしてみよう";
    $("#hintLine").style.display="block";
    drawClock(); drawReadout();
  }else{
    $("#hintLine").style.display="none";
    newQuiz();
  }
}
document.querySelectorAll(".schip").forEach(c=>{
  c.addEventListener("click",()=>{
    stage=c.dataset.st;
    document.querySelectorAll(".schip").forEach(x=>x.classList.toggle("on",x===c));
    newQuiz();
  });
});
document.querySelectorAll("#seg button").forEach(b=>{
  b.addEventListener("click",()=>{
    lv=Number(b.dataset.lv);
    document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));
    drawClock(); drawReadout();
  });
});

/* ---------- ×5 sprint ---------- */
let spTimer=null, spLeft=60, spScore=0;
$("#sprintOpen").addEventListener("click",()=>{ $("#overlay").classList.add("show"); startSprint(); });
$("#sprintClose").addEventListener("click",closeSprint);
function closeSprint(){ $("#overlay").classList.remove("show"); clearInterval(spTimer); }
function startSprint(){
  spLeft=60; spScore=0; clearInterval(spTimer);
  spTimer=setInterval(()=>{
    spLeft--; const t=$("#spTime"); if(t)t.textContent=spLeft;
    if(spLeft<=0){ clearInterval(spTimer); endSprint(); }
  },1000);
  sprintQ();
}
function sprintQ(){
  const n=rint(1,11), correct=n*5;
  const set=new Set([correct]);
  set.add(n);                                   // ×5わすれ
  while(set.size<3){ const w=rint(1,11)*5; set.add(w); }
  const opts=shuffle([...set]).slice(0,3);
  if(!opts.includes(correct)){ opts[0]=correct; shuffle(opts); }
  $("#sprintBody").innerHTML=
    '<div class="sprint-head"><span>せいかい: <b style="color:var(--green)">'+spScore+'</b></span><span class="sprint-time" id="spTime">'+spLeft+"</span></div>"+
    '<div class="sprint-q">ながい はりが <b style="color:var(--blue-deep)">'+n+'</b>を さしてたら<br>なん'+funSuffix(n*5)+'？</div>'+
    '<div class="choices">'+opts.map(o=>'<button class="choice" data-v="'+o+'">'+o+"</button>").join("")+"</div>";
  document.querySelectorAll("#sprintBody .choice").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(Number(btn.dataset.v)===correct){ spScore++; sprintQ(); }
      else{ btn.classList.add("ng"); btn.disabled=true; }
    });
  });
}
function endSprint(){
  $("#sprintBody").innerHTML=
    '<div class="done-face">⚡</div>'+
    '<div class="done-text">'+spScore+' もん せいかい！</div>'+
    '<p style="text-align:center;color:var(--sub);font-weight:700">5とびが はやくなると、とけいが すらすら よめるよ</p>'+
    '<button class="next-btn" id="spAgain">もういちど</button>'+
    '<button class="ghost-btn" id="spEnd">おわる</button>';
  $("#spAgain").addEventListener("click",startSprint);
  $("#spEnd").addEventListener("click",closeSprint);
}

/* ---------- go ---------- */
drawClock(); drawReadout();
</script>
</body>
</html>
