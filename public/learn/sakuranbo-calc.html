<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>さくらんぼ けいさんき | LifeMargin Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F3; --card:#FFFFFF; --ink:#31424B; --sub:#7C8B92;
  --green:#2F8F6B; --green-deep:#227455; --green-soft:#E3F1EA;
  --blue:#5B7FD4; --blue-soft:#E9EFFB;
  --cherry:#E8734F; --cherry-deep:#C85A38; --cherry-soft:#FBEDE6;
  --note:#FFF8DE; --note-edge:#EBDCA6; --note-ink:#7E651F;
  --r:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  font-size:17px; line-height:1.6; min-height:100vh;
}
.wrap{max-width:640px; margin:0 auto; padding:16px 14px 90px;}
header{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:4px 4px 10px;}
h1{font-size:20px; font-weight:800; margin:0;}
h1 .dot{color:var(--cherry);}
.count{font-size:13px; color:var(--sub); font-weight:700;}
.count b{color:var(--green); font-size:17px;}

.mode-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
.seg{display:flex; background:#E2E9E6; border-radius:999px; padding:4px; flex:1; min-width:230px;}
.seg button{
  flex:1; border:0; background:transparent; border-radius:999px;
  padding:9px 6px; font-family:inherit; font-size:14px; font-weight:800; color:var(--sub); cursor:pointer;
}
.seg button.on{background:var(--card); color:var(--green-deep); box-shadow:0 1px 3px rgba(40,60,55,.18);}
.seg-note{width:100%; font-size:12px; color:var(--sub); margin:-6px 0 0 8px;}
.sprint-btn{
  border:2px solid var(--blue); color:var(--blue); background:var(--card);
  border-radius:999px; padding:9px 16px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer;
}

/* memo shelf */
.shelf{
  background:linear-gradient(#EAE3CF,#E4DCC4); border-radius:var(--r);
  padding:12px 12px 14px; margin-bottom:14px; min-height:64px;
  border-bottom:6px solid #CDC3A4;
}
.shelf-label{font-size:12px; font-weight:800; color:#8B7F5A; letter-spacing:.12em; margin:0 0 8px 4px;}
.notes{display:flex; flex-wrap:wrap; gap:8px;}
.note{
  background:var(--note); border:1px solid var(--note-edge); color:var(--note-ink);
  border-radius:6px; padding:6px 12px; font-weight:800; font-size:16px;
  box-shadow:1px 2px 3px rgba(90,75,30,.18); transform:rotate(-1deg);
}
.note:nth-child(even){transform:rotate(1.2deg);}
.note.pop{animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.6) rotate(-4deg); opacity:0;}}
.shelf-empty{color:#A99C74; font-size:13px; font-weight:700; padding:4px;}

/* problem + dots stage */
.card{background:var(--card); border-radius:var(--r); padding:18px 16px; box-shadow:0 2px 10px rgba(40,60,55,.07); margin-bottom:14px;}
.q-main{font-size:42px; font-weight:800; text-align:center; letter-spacing:.05em; margin:0 0 6px;}
.q-main .op{color:var(--cherry); margin:0 8px;}
.stage{display:block; width:100%; user-select:none; -webkit-user-select:none;}

/* step card */
.step-title{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.step-num{
  background:var(--cherry); color:#fff; font-weight:800; font-size:14px;
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;
}
.step-title h2{font-size:18px; font-weight:800; margin:0;}
.saku{display:flex; justify-content:center; margin:4px 0 12px;}
.choices{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.choice{
  border:2px solid #DDE5E1; background:#FBFDFC; border-radius:16px;
  padding:16px 8px; font-family:inherit; font-size:30px; font-weight:800; color:var(--ink); cursor:pointer;
}
.choice:active{background:var(--green-soft);}
.choice.ok{border-color:var(--green); background:var(--green-soft); color:var(--green-deep);}
.choice.ng{border-color:#E5B8A6; background:var(--cherry-soft); animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.msg{min-height:28px; text-align:center; font-weight:800; font-size:16px; margin-top:10px; color:var(--sub);}
.msg.good{color:var(--green-deep);}
.msg.soft{color:#B07D4F;}

.ans-view{
  background:#F4F8F6; border:2px dashed #C9D8D1; border-radius:14px;
  min-height:60px; display:flex; align-items:center; justify-content:center;
  font-size:34px; font-weight:800; margin-bottom:12px; color:var(--green-deep);
}
.pad{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.pad button{
  border:0; border-radius:14px; background:#EDF2F0; color:var(--ink);
  font-family:inherit; font-size:24px; font-weight:800; padding:14px 0; cursor:pointer;
}
.pad button:active{background:#DCE7E2;}
.pad .go{grid-row:span 2; background:var(--green); color:#fff; font-size:20px;}
.pad .del{background:#F3E9E4; color:#B07D4F; font-size:20px;}

.next-btn{
  width:100%; border:0; border-radius:16px; background:var(--green); color:#fff;
  font-family:inherit; font-size:19px; font-weight:800; padding:16px; cursor:pointer; margin-top:6px;
  box-shadow:0 3px 0 var(--green-deep);
}
.ghost-btn{
  width:100%; border:2px solid #D5DEDA; border-radius:16px; background:var(--card); color:var(--sub);
  font-family:inherit; font-size:15px; font-weight:800; padding:12px; cursor:pointer; margin-top:10px;
}
.done-face{text-align:center; font-size:52px; margin:4px 0;}
.done-text{text-align:center; font-size:24px; font-weight:800; color:var(--green-deep); margin-bottom:14px;}

/* sprint overlay */
.overlay{
  position:fixed; inset:0; background:rgba(38,52,48,.45); display:none;
  align-items:flex-start; justify-content:center; padding:24px 14px; z-index:50; overflow:auto;
}
.overlay.show{display:flex;}
.sprint-card{background:var(--card); border-radius:var(--r); padding:20px 18px; width:100%; max-width:520px;}
.sprint-head{display:flex; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:10px;}
.sprint-time{font-size:26px; color:var(--blue);}
.sprint-q{font-size:30px; font-weight:800; text-align:center; margin:14px 0;}
.close-x{border:0; background:transparent; font-size:22px; cursor:pointer; color:var(--sub); font-weight:800;}

@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
@media (max-width:420px){ .q-main{font-size:36px;} .choice{font-size:26px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>さくらんぼ けいさんき<span class="dot">🍒</span></h1>
    <div class="count">きょう とけた: <b id="solved">0</b> もん</div>
  </header>

  <div class="mode-row">
    <div class="seg" id="seg">
      <button data-lv="0" class="on">🐢 ゆっくり</button>
      <button data-lv="1">🚶 ふつう</button>
      <button data-lv="2">🚀 じぶんで</button>
    </div>
    <button class="sprint-btn" id="sprintOpen">⚡ 10づくりスプリント</button>
    <div class="seg-note">きょうの ちょうしに あわせて えらんでね。とちゅうで かえてもOK！</div>
  </div>

  <div class="shelf">
    <p class="shelf-label">📌 メモだな — おぼえておくのは この子の しごと</p>
    <div class="notes" id="notes"><div class="shelf-empty">まだ なにも のってないよ</div></div>
  </div>

  <div class="card">
    <div class="q-main" id="qMain"></div>
    <svg id="stage" class="stage" viewBox="0 0 640 210"></svg>
  </div>

  <div class="card" id="stepCard"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sprint-card">
    <div class="sprint-head">
      <span>⚡ 10づくりスプリント（60びょう）</span>
      <button class="close-x" id="sprintClose">✕</button>
    </div>
    <div id="sprintBody"></div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1));}

/* ---------- state ---------- */
let level=0, solved=0, P=null, stepIdx=0, wrongInSelf=0, padVal="";

/* ---------- problem generation ---------- */
function newProblem(){
  const add=Math.random()<0.5;
  if(add){ // a+b, a,b in 2..9, sum 11..18  → sakuranbo: b = need + rest, need=10-a
    let a,b;
    do{ a=rint(4,9); b=rint(2,9);}while(a+b<11 || a+b>18);
    P={type:"add", a, b, need:10-a, rest:b-(10-a), ans:a+b};
  }else{ // a-b, a in 11..18, b in 2..9, result < 10 (くり下がり必須: aの一の位 < b)
    let a,b;
    do{ a=rint(11,18); b=rint(2,9);}while(a-b>=10 || (a%10)>=b);
    P={type:"sub", a, b, loose:a-10, after:10-b, ans:a-b};
  }
  stepIdx=0; wrongInSelf=0; padVal="";
  clearNotes();
  $("#qMain").innerHTML=P.a+'<span class="op">'+(P.type==="add"?"＋":"−")+'</span>'+P.b+'<span class="op">=</span>？';
  drawStage();
  render();
}

/* ---------- memo shelf ---------- */
function clearNotes(){ $("#notes").innerHTML='<div class="shelf-empty">まだ なにも のってないよ</div>'; }
function pin(label,value){
  const box=$("#notes");
  const empty=box.querySelector(".shelf-empty"); if(empty) empty.remove();
  const n=document.createElement("div");
  n.className="note pop";
  n.innerHTML="<small style='display:block;font-size:11px;opacity:.75'>"+label+"</small>"+value;
  box.appendChild(n);
}

/* ---------- 10-frame stage (SVG) ---------- */
/*
 states rendered from P + stepIdx:
 add:  frame has a blue dots. loose has b cherry dots.
       stepIdx>=2: 'need' cherry dots moved into frame (frame full), loose has rest.
 sub:  frame full 10 blue. loose has (a-10) cherry dots.
       stepIdx>=2: b blue dots in frame faded (crossed). 
*/
function dot(cx,cy,fill,extra){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="17" fill="'+fill+'" '+(extra||"")+'/>';
}
function drawStage(){
  const fx=30, fy=40, cell=52; // frame top-left
  let html="";
  // frame background (2 rows x 5 cols)
  html+='<text x="'+(fx+cell*2.5)+'" y="28" font-size="16" font-weight="800" fill="#7C8B92" text-anchor="middle" font-family="inherit">10の す</text>';
  for(let i=0;i<10;i++){
    const cx=fx+(i%5)*cell, cy=fy+Math.floor(i/5)*cell;
    html+='<rect x="'+(cx)+'" y="'+(cy)+'" width="'+cell+'" height="'+cell+'" fill="#FBFDFC" stroke="#C9D8D1" stroke-width="2" rx="8"/>';
  }
  const center=(i)=>[fx+(i%5)*cell+cell/2, fy+Math.floor(i/5)*cell+cell/2];

  const lx=fx+cell*5+50, ly=fy; // loose area
  html+='<text x="'+(lx+cell*1.4)+'" y="28" font-size="16" font-weight="800" fill="#7C8B92" text-anchor="middle" font-family="inherit">そとの かず</text>';
  const loosePos=(i)=>[lx+(i%3)*cell+cell/2, ly+Math.floor(i/3)*cell+cell/2];

  if(P.type==="add"){
    // blue in frame
    for(let i=0;i<P.a;i++){ const[cx,cy]=center(i); html+=dot(cx,cy,"#5B7FD4"); }
    if(stepIdx>=2){
      for(let i=0;i<P.need;i++){ const[cx,cy]=center(P.a+i); html+=dot(cx,cy,"#E8734F",'class="pop"'); }
      for(let i=0;i<P.rest;i++){ const[cx,cy]=loosePos(i); html+=dot(cx,cy,"#E8734F"); }
      // full-frame highlight
      html+='<rect x="'+(fx-6)+'" y="'+(fy-6)+'" width="'+(cell*5+12)+'" height="'+(cell*2+12)+'" fill="none" stroke="#2F8F6B" stroke-width="4" rx="12"/>';
      html+='<text x="'+(fx+cell*2.5)+'" y="'+(fy+cell*2+34)+'" font-size="20" font-weight="800" fill="#227455" text-anchor="middle" font-family="inherit">10 ！</text>';
    }else{
      for(let i=0;i<P.b;i++){ const[cx,cy]=loosePos(i); html+=dot(cx,cy,"#E8734F"); }
      // highlight empty slots
      for(let i=P.a;i<10;i++){ const[cx,cy]=center(i);
        html+='<circle cx="'+cx+'" cy="'+cy+'" r="17" fill="none" stroke="#E8734F" stroke-width="3" stroke-dasharray="4 4"/>'; }
    }
  }else{
    // sub: frame full 10 blue, loose = a-10 cherry
    for(let i=0;i<10;i++){
      const[cx,cy]=center(i);
      if(stepIdx>=2 && i>=10-P.b){ // faded (taken away) — take from the end
        html+=dot(cx,cy,"#D8E1DD");
        html+='<line x1="'+(cx-12)+'" y1="'+(cy-12)+'" x2="'+(cx+12)+'" y2="'+(cy+12)+'" stroke="#B07D4F" stroke-width="3"/>';
      }else{
        html+=dot(cx,cy,"#5B7FD4");
      }
    }
    for(let i=0;i<P.loose;i++){ const[cx,cy]=loosePos(i); html+=dot(cx,cy,"#E8734F"); }
    if(stepIdx>=1){
      html+='<text x="'+(lx+cell*1.4)+'" y="'+(ly+cell*2+34)+'" font-size="18" font-weight="800" fill="#C85A38" text-anchor="middle" font-family="inherit">'+P.loose+'は まっててね</text>';
    }
  }
  $("#stage").innerHTML=html;
}

/* ---------- sakuranbo mini graphic ---------- */
function sakuSvg(top, left, right, hideRight){
  return '<svg width="180" height="120" viewBox="0 0 180 120">'+
    '<circle cx="90" cy="30" r="26" fill="#FBFDFC" stroke="#C9D8D1" stroke-width="2"/>'+
    '<text x="90" y="40" font-size="26" font-weight="800" text-anchor="middle" fill="#31424B" font-family="inherit">'+top+'</text>'+
    '<line x1="78" y1="52" x2="52" y2="76" stroke="#8FA79E" stroke-width="3"/>'+
    '<line x1="102" y1="52" x2="128" y2="76" stroke="#8FA79E" stroke-width="3"/>'+
    '<circle cx="46" cy="94" r="24" fill="#FBEDE6" stroke="#E8734F" stroke-width="2.5"/>'+
    '<text x="46" y="103" font-size="24" font-weight="800" text-anchor="middle" fill="#C85A38" font-family="inherit">'+left+'</text>'+
    '<circle cx="134" cy="94" r="24" fill="'+(hideRight?"#FBFDFC":"#FBEDE6")+'" stroke="#E8734F" stroke-width="2.5" '+(hideRight?'stroke-dasharray="5 4"':"")+'/>'+
    '<text x="134" y="103" font-size="24" font-weight="800" text-anchor="middle" fill="#C85A38" font-family="inherit">'+(hideRight?"？":right)+'</text>'+
  '</svg>';
}

/* ---------- steps ---------- */
function render(){
  drawStage();
  if(level===2){ renderSelf(); return; }
  if(P.type==="add"){ [addS1,addS2,addS3,renderDone][stepIdx](); }
  else{ [subS1,subS2,subS3,renderDone][stepIdx](); }
}
function stepHeader(num,title){
  return '<div class="step-title"><span class="step-num">'+num+'</span><h2>'+title+'</h2></div>';
}
function choices(correct, onOk, okMsg){
  const set=new Set([correct]);
  while(set.size<3){ const w=correct+rint(-2,2); if(w>=0&&w!==correct) set.add(w); }
  const opts=shuffle([...set]);
  const html='<div class="choices">'+opts.map(o=>'<button class="choice" data-v="'+o+'">'+o+'</button>').join("")+'</div><div class="msg" id="msg"></div>';
  return {html, bind(){
    document.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click",()=>{
        if(Number(btn.dataset.v)===correct){
          btn.classList.add("ok");
          $("#msg").textContent=okMsg||"せいかい！"; $("#msg").className="msg good";
          document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
          setTimeout(onOk,700);
        }else{
          btn.classList.add("ng"); btn.disabled=true;
          $("#msg").textContent="おしい！ もういちど えらんでみて"; $("#msg").className="msg soft";
        }
      });
    });
  }};
}

/* --- addition steps --- */
function addS1(){
  const c=choices(P.need,()=>{
    pin("10まで あと", P.need);
    stepIdx=1; render();
  },"そう！ すの あきは "+P.need+"こ だね");
  $("#stepCard").innerHTML=
    stepHeader(1,P.a+"は あと いくつで 10？")+
    (level===0?'<div class="msg" style="margin-bottom:8px">💡 すの あいてる ところを かぞえてみよう</div>':"")+
    c.html;
  c.bind();
}
function addS2(){
  const c=choices(P.rest,()=>{
    pin("さくらんぼ", P.b+"→"+P.need+"と"+P.rest);
    stepIdx=2; render();
  },"ピッタリ！ "+P.need+"こが すに はいるよ");
  $("#stepCard").innerHTML=
    stepHeader(2,P.b+"を "+P.need+"と いくつに わける？")+
    '<div class="saku">'+sakuSvg(P.b,P.need,P.rest,true)+"</div>"+
    c.html;
  c.bind();
}
function addS3(){
  const c=choices(P.ans,()=>{
    pin("こたえ", P.ans);
    stepIdx=3; render();
  },"できた！");
  $("#stepCard").innerHTML=
    stepHeader(3,"10と "+P.rest+"で いくつ？")+
    (level===0?'<div class="msg" style="margin-bottom:8px">💡 すは 10で いっぱい。そとに '+P.rest+'こ</div>':"")+
    c.html;
  c.bind();
}

/* --- subtraction steps (減加法) --- */
function subS1(){
  const c=choices(P.loose,()=>{
    pin("さくらんぼ", P.a+"→10と"+P.loose);
    stepIdx=1; render();
  },"そう！ "+P.loose+"は そとで まっててね");
  $("#stepCard").innerHTML=
    stepHeader(1,P.a+"を 10と いくつに わける？")+
    '<div class="saku">'+sakuSvg(P.a,10,P.loose,true)+"</div>"+
    c.html;
  c.bind();
}
function subS2(){
  const c=choices(P.after,()=>{
    pin("10−"+P.b, P.after);
    stepIdx=2; render();
  },"そのとおり！");
  $("#stepCard").innerHTML=
    stepHeader(2,"10から "+P.b+"を ひくと？")+
    (level===0?'<div class="msg" style="margin-bottom:8px">💡 すの なかから '+P.b+'こ とるよ</div>':"")+
    c.html;
  c.bind();
}
function subS3(){
  const c=choices(P.ans,()=>{
    pin("こたえ", P.ans);
    stepIdx=3; render();
  },"できた！");
  $("#stepCard").innerHTML=
    stepHeader(3,P.after+"と そとの "+P.loose+"で いくつ？")+
    (level===0?'<div class="msg" style="margin-bottom:8px">💡 のこった あおと そとの あかを あわせよう</div>':"")+
    c.html;
  c.bind();
}

/* --- done --- */
function renderDone(){
  solved++; $("#solved").textContent=solved;
  $("#stepCard").innerHTML=
    '<div class="done-face">🍒</div>'+
    '<div class="done-text">'+P.a+(P.type==="add"?" ＋ ":" − ")+P.b+" ＝ "+P.ans+"</div>"+
    '<button class="next-btn" id="nextBtn">つぎの もんだいへ →</button>';
  $("#nextBtn").addEventListener("click",newProblem);
}

/* --- self mode --- */
function buildPad(){
  return '<div class="pad">'+
    '<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="del" data-k="del">⌫</button>'+
    '<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="go" data-k="go">OK</button>'+
    '<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>'+
    '<button data-k="0">0</button><button data-k="" disabled style="opacity:.3"></button><button data-k="" disabled style="opacity:.3"></button>'+
  '</div>';
}
function renderSelf(){
  padVal="";
  $("#stepCard").innerHTML=
    stepHeader("？","こたえは？")+
    '<div class="ans-view" id="ansView">&nbsp;</div>'+buildPad()+
    '<div class="msg" id="msg"></div>'+
    '<button class="ghost-btn" id="stepFallback">🐢 さくらんぼで とく</button>';
  document.querySelectorAll(".pad button").forEach(b=>{
    b.addEventListener("click",()=>{
      const k=b.dataset.k;
      if(k==="del"){ padVal=padVal.slice(0,-1); }
      else if(k==="go"){
        if(padVal==="")return;
        if(Number(padVal)===P.ans){ stepIdx=3; renderDone(); return; }
        wrongInSelf++; padVal="";
        $("#msg").textContent=wrongInSelf>=2?"むずかしい日も ある！ さくらんぼで やっちゃおう":"おしい！ もういちど";
        $("#msg").className="msg soft";
      }
      else if(k && padVal.length<2){ padVal+=k; }
      const av=$("#ansView"); if(av) av.textContent=padVal||"\u00A0";
    });
  });
  $("#stepFallback").addEventListener("click",()=>{ level=1; syncSeg(); stepIdx=0; render(); });
}

/* ---------- support level ---------- */
function syncSeg(){
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",Number(b.dataset.lv)===level));
}
document.querySelectorAll("#seg button").forEach(b=>{
  b.addEventListener("click",()=>{ level=Number(b.dataset.lv); syncSeg(); stepIdx=0; render(); });
});

/* ---------- 10づくり sprint ---------- */
let spTimer=null, spLeft=60, spScore=0;
$("#sprintOpen").addEventListener("click",()=>{ $("#overlay").classList.add("show"); startSprint(); });
$("#sprintClose").addEventListener("click",closeSprint);
function closeSprint(){ $("#overlay").classList.remove("show"); clearInterval(spTimer); }
function startSprint(){
  spLeft=60; spScore=0; clearInterval(spTimer);
  spTimer=setInterval(()=>{
    spLeft--; const t=$("#spTime"); if(t)t.textContent=spLeft;
    if(spLeft<=0){ clearInterval(spTimer); endSprint(); }
  },1000);
  sprintQ();
}
function sprintQ(){
  const n=rint(1,9), correct=10-n;
  const set=new Set([correct]);
  while(set.size<3){ const w=correct+rint(-2,2); if(w>=1&&w<=9) set.add(w); }
  const opts=shuffle([...set]);
  $("#sprintBody").innerHTML=
    '<div class="sprint-head"><span>せいかい: <b style="color:var(--green)">'+spScore+'</b></span><span class="sprint-time" id="spTime">'+spLeft+"</span></div>"+
    '<div class="sprint-q">'+n+"と いくつで <b style='color:var(--cherry)'>10</b>？</div>"+
    '<div class="choices">'+opts.map(o=>'<button class="choice" data-v="'+o+'">'+o+"</button>").join("")+"</div>";
  document.querySelectorAll("#sprintBody .choice").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(Number(btn.dataset.v)===(10-n)){ spScore++; sprintQ(); }
      else{ btn.classList.add("ng"); btn.disabled=true; }
    });
  });
}
function endSprint(){
  $("#sprintBody").innerHTML=
    '<div class="done-face">⚡</div>'+
    '<div class="done-text">'+spScore+' もん せいかい！</div>'+
    '<p style="text-align:center;color:var(--sub);font-weight:700">10づくりが はやくなると、くりあがりが ぐっと ラクになるよ</p>'+
    '<button class="next-btn" id="spAgain">もういちど</button>'+
    '<button class="ghost-btn" id="spEnd">おわる</button>';
  $("#spAgain").addEventListener("click",startSprint);
  $("#spEnd").addEventListener("click",closeSprint);
}

/* ---------- go ---------- */
newProblem();
